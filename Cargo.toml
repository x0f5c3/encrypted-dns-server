[package]
name = "encrypted-dns"
version = "0.9.22"
authors = ["Frank Denis <github@pureftpd.org>"]
edition = "2018"
description = "A modern encrypted DNS server (DNSCrypt v2, Anonymized DNSCrypt, DoH)"
keywords = ["dnscrypt", "encryption", "dns", "doh", "proxy"]
license = "MIT"
homepage = "https://github.com/jedisct1/encrypted-dns-server"
repository = "https://github.com/jedisct1/encrypted-dns-server"
categories = ["asynchronous", "network-programming", "command-line-utilities"]
readme = "README.md"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
  "example-encrypted-dns.toml",
]

[dependencies]
anyhow = "1.0.104"
byteorder = "1.5.0"
clap = { version = "4.6.7", default-features = false, features = [
  "std",
  "cargo",
  "wrap_help",
] }
coarsetime = "0.1.37"
daemonize-simple = "0.1.6"
dnsstamps = "0.1.10"
educe = { version = "0.8.1", features = ["full"] }
env_logger = { version = "0.11.11", default-features = false, features = [
  "humantime",
] }
futures = { version = "0.3.34", features = ["async-await"] }
hyper = { version = "1.11.1", default-features = false, features = [
  "server",
  "http1",
], optional = true }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
ipext = "0.1.0"
libsodium-sys-stable = "1.24.0"
log = { version = "0.4.34", features = ["std", "release_max_level_debug"] }
mimalloc = { version = "0.1.52", default-features = false }
parking_lot = "0.12.5"
rand = "0.10.3"
rlimit = "0.11.0"
rustc-hash = "2.1.3"
serde = "1.0.229"
serde_derive = "1.0.229"
serde-big-array = "0.5.1"
sieve-cache = "1.1.6"
siphasher = "1.0.3"
slabigator = "0.9.6"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = [
  "net",
  "io-std",
  "io-util",
  "fs",
  "time",
  "rt-multi-thread",
] }
toml = "1.1.6"
hickory-server = { version = "0.26.3", features = ["dnssec-ring", "https-ring", "rustls-platform-verifier", "resolver", "sqlite", "toml", "webpki-roots", "tls-ring", "quic-ring", "h3-ring"]}
dryoc = { git = "https://github.com/brndnmtthws/dryoc", rev = "18c89b11e3432322337e3e6073106aea3bd0c4af", default-features = false, features = ["std"] }
chacha20 = { version = "=0.9.1", features = ["zeroize"] }
poly1305 = { version = "=0.8.0", features = ["zeroize"] }
sha2 = "0.11.0"
hkdf = "0.13.0"
hex = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2.6"

# Optional normal dependency: Cargo does not support optional dev-dependencies.
libsodium-sys = { package = "libsodium-sys-stable", version = "=1.24.0", optional = true }


[target.'cfg(target_family = "unix")'.dependencies]
privdrop = "0.5.6"

[dependencies.prometheus]
optional = true
package = "prometheus"
version = "0.14.0"
default-features = false
features = ["process"]

[features]
default = ["metrics"]
metrics = ["hyper", "prometheus"]
sodium-compat-tests = ["dep:libsodium-sys"]

[package.metadata.deb]
extended-description = """\
An easy to install, high-performance, zero maintenance proxy to run an \
encrypted DNS server."""
assets = [
  [
    "target/release/encrypted-dns",
    "usr/bin/",
    "755",
  ],
  [
    "README.md",
    "usr/share/doc/encrypted-dns/README.md",
    "644",
  ],
  [
    "example-encrypted-dns.toml",
    "usr/share/doc/encrypted-dns/example-encrypted-dns.toml",
    "644",
  ],
]
section = "network"
depends = "$auto"
priority = "optional"

[profile.release]
codegen-units = 1
incremental = false
panic = "abort"

[dev-dependencies]
criterion = "0.8.2"
anyhow = "1"

[[bench]]
name = "crypto_backends"
harness = false
required-features = ["sodium-compat-tests"]